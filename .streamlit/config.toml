# Streamlit defaults for verboseFC.
#
# The app has no login and can read/move files, so it binds to this machine
# only by default. To reach it from another device on your network, start it
# with an explicit override and accept that anyone on that network can use it:
#
#     streamlit run src/verboseFC.py --server.address 0.0.0.0
#
# A custom port is fine: streamlit run src/verboseFC.py --server.port 8599

[server]
address = "127.0.0.1"
headless = true

[browser]
gatherUsageStats = false
